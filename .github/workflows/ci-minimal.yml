name: CI Minimal

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check shipped meta surfaces
        run: |
          required_files=(
            README.md
            profile/README.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
            seed.yaml
            organ-aesthetic.yaml
            .github/ISSUE_TEMPLATE/bug_report.md
            .github/ISSUE_TEMPLATE/documentation.md
            .github/ISSUE_TEMPLATE/feature_request.md
            .github/ISSUE_TEMPLATE/config.yml
            .github/PULL_REQUEST_TEMPLATE.md
            .github/dependabot.yml
            .github/workflows/dispatch-receiver.yml
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required activation artifact: $file"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          grep -q "ORGAN-III: Ergon" profile/README.md
          grep -q "organvm-iii-ergon" README.md
          echo "All shipped activation artifacts are present"

      - name: Validate YAML contracts
        run: |
          ruby -e "require 'yaml'; ARGV.each { |path| YAML.load_file(path); puts \"#{path} is valid YAML\" }" \
            seed.yaml \
            organ-aesthetic.yaml \
            .github/dependabot.yml \
            .github/ISSUE_TEMPLATE/config.yml

      - name: Secret scan
        run: |
          FOUND=0
          for pattern in 'sk-[a-zA-Z0-9]{20,}' 'ghp_[a-zA-Z0-9]{36}' 'AKIA[A-Z0-9]{16}'; do
            if git grep -lP "$pattern" -- ':!.github' 2>/dev/null; then
              echo "::error::Potential secret pattern found: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secret patterns detected"

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
